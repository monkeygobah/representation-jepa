run:
  name: "delta-smoke-lejepa-random"
  runs_root: "/work/nvme/bhgj/gnahass/representation-jepa/runs"
  seed: 2026
  total_steps: 10
  warmup_steps: 2
  log_every: 1
  ckpt_every: 10
  resume: false
  resume_ckpt: null

runtime:
  distributed: false
  ddp_backend: "nccl"
  gpu: 0

data:
  dataset: "subset6_minus_7"
  train_root: "/work/nvme/bhgj/gnahass/representation-jepa/data/smoke_subset6_minus_7_train_flat"

  val_root: null
  test_root: null
  external_test_roots: []
  image_size: 224

dataloader:
  batch_size: 16
  num_workers: 4
  shuffle: true
  pin_memory: true
  drop_last: true

model:
  backbone: "resnet101"
  init: "random"
  seg_ckpt: "/work/nvme/bhgj/gnahass/representation-jepa/models/hp_tune.pth"
  feat_dim: 2048
  proj_dim: 128
  proj_hidden: 2048
  proj_layers: 3

ssl:
  method: "lejepa"
  aug_mode: "local_only"
  normalize_imagenet: true
  V: 2
  crop_size: 112
  crop_scale_min: 0.08
  crop_scale_max: 1.0

loss:
  lamb: 0.05
  regularizer: "sigreg"
  sigreg_knots: 17
  sigreg_num_slices: 256
  ep_partial_num_slices: 256
  ep_partial_scale_by_n: false
  bhep_beta: 1.0
  bhep_scale_by_n: false

optim:
  lr: 5.0e-4
  weight_decay: 5.0e-4
  warmup_factor: 0.01

sched:
  final_lr: 5.0e-7

amp:
  enabled: true
  dtype: "bf16"
