run:
  name: "geometry-fixedcompute-vit-b16-100k-infonce-imagenet-50ksteps"
  runs_root: "/work/nvme/bhgj/gnahass/representation-jepa/runs"
  seed: 2026
  total_steps: 50000
  warmup_steps: 12500
  log_every: 100
  ckpt_every: 10000
  resume: false
  resume_ckpt: null

runtime:
  distributed: false
  ddp_backend: "nccl"
  gpu: 0

data:
  dataset: "subset6_minus_7"
  train_root: "/work/nvme/bhgj/gnahass/representation-jepa/data/subset6_minus_7_train_flat"
  train_manifest: "/u/gnahass/representation-jepa/data/manifests/subset6_minus_7_train_flat_100_000.txt"
  val_root: null
  test_root: null
  external_test_roots: []
  image_size: 224

dataloader:
  batch_size: 384
  num_workers: 8
  shuffle: true
  pin_memory: true
  drop_last: true

model:
  backbone: "vit_base_patch16_224"
  init: "imagenet"
  seg_ckpt: null
  feat_dim: 768
  proj_dim: 128
  proj_hidden: 2048
  proj_layers: 3

ssl:
  method: "infonce"
  aug_mode: "local_only"
  normalize_imagenet: true
  V: 2
  crop_size: 112
  crop_scale_min: 0.08
  crop_scale_max: 1.0

optim:
  lr: 5.0e-4
  weight_decay: 5.0e-4
  warmup_factor: 0.01

sched:
  final_lr: 5.0e-7

amp:
  enabled: true
  dtype: "bf16"

infonce:
  tau: 0.2
  gather: true
  eps: 1.0e-8
