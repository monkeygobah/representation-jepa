study:
  name: "disease_vit_b16_1m_50k_g4"
  output_root: "/workspace/disease_embeddings/outputs/vit_b16_1m_50k"

dataset:
  root: "/workspace/disease_embeddings/diseased-eyes-224"
  manifest_csv: "/workspace/disease_embeddings/diseased-eyes-224/manifest.csv"
  image_size: 224
  normalize_imagenet: true

pooling: "g4"
embedding_key: "backbone/features"

models:
  - model_id: "lejepa_vitb16_1m_random_50k"
    label: "LeJEPA ViT-B/16 1M Random"
    source: "checkpoint"
    run_name: "geometry-fixedcompute-vit-b16-1m-lejepa-random-50ksteps"
    config_path: "/workspace/configs/delta/fixedcompute_vit_b16_50ksteps/geometry-fixedcompute-vit-b16-1m-lejepa-random-50ksteps.yaml"
    checkpoint_path: "/workspace/delta_checkpoints/fixedcompute_vit_b16_50ksteps/20260527_143021__geometry-fixedcompute-vit-b16-1m-lejepa-random-50ksteps/checkpoints/ckpt_step_0050000.pth"
    checkpoint_step: 50000
    backbone: "vit_base_patch16_224"
    pretrain_init: "random"
    method: "lejepa"
    feat_dim: 768
    model_family: "vit"
    patch_size: 16

  - model_id: "lejepa_vitb16_1m_imagenet_50k"
    label: "LeJEPA ViT-B/16 1M ImageNet"
    source: "checkpoint"
    run_name: "geometry-fixedcompute-vit-b16-1m-lejepa-imagenet-50ksteps"
