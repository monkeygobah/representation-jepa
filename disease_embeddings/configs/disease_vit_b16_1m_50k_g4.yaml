    run_name: "geometry-fixedcompute-vit-b16-1m-infonce-imagenet-50ksteps"
    config_path: "/workspace/configs/delta/fixedcompute_vit_b16_50ksteps/geometry-fixedcompute-vit-b16-1m-infonce-imagenet-50ksteps.yaml"
    checkpoint_path: "/workspace/delta_checkpoints/fixedcompute_vit_b16_50ksteps/20260527_141814__geometry-fixedcompute-vit-b16-1m-infonce-imagenet-50ksteps/checkpoints/ckpt_step_0050000.pth"
