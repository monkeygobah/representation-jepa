    checkpoint_step: 50000
    backbone: "vit_base_patch16_224"
    pretrain_init: "imagenet"
    method: "lejepa"
    feat_dim: 768
    model_family: "vit"
    patch_size: 16

  - model_id: "infonce_vitb16_1m_random_50k"
