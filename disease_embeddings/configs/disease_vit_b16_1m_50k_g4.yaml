extraction:
  batch_size: 128
  num_workers: 4
  device: "auto"
  precision: "fp32"
  overwrite: false

reduction:
  method: "tsne"
  random_state: 0
  tsne_perplexity: 30.0

supervised:
  label_column: "folder_label"
  group_column: "source_image_path"
  train_frac: 0.8
  seed: 0
  linear_epochs: 100
  linear_batch_size: 128
  linear_lr: 0.001
  finetune_epochs: 5
  finetune_batch_size: 32
  backbone_lr: 0.0001
  head_lr: 0.001
  weight_decay: 0.0001
