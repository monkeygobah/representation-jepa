study:
  name: "disease_random_1m_g4"
  output_root: "/workspace/disease_embeddings/outputs"

dataset:
  root: "/workspace/disease_embeddings/diseased-eyes-224"
  manifest_csv: "/workspace/disease_embeddings/diseased-eyes-224/manifest.csv"
  image_size: 224
  normalize_imagenet: true

pooling: "g4"
embedding_key: "backbone/features"

models:
  - model_id: "lejepa_random_1m"
    label: "LeJEPA Random 1M"
    source: "checkpoint"
    run_name: "geometry-fixedcompute-1m-lejepa-random-50ksteps"
    run_dir: "/workspace/runs/20260422_163700__geometry-fixedcompute-1m-lejepa-random-50ksteps"
    checkpoint_step: 50000

  - model_id: "vicreg_random_1m"
    label: "VICReg Random 1M"
    source: "checkpoint"
    run_name: "geometry-fixedcompute-1m-vicreg-random-50ksteps"
    run_dir: "/workspace/runs/20260422_225927__geometry-fixedcompute-1m-vicreg-random-50ksteps"
    checkpoint_step: 50000

  - model_id: "infonce_random_1m"
    label: "InfoNCE Random 1M"
    source: "checkpoint"
    run_name: "geometry-fixedcompute-1m-infonce-random-50ksteps"
    run_dir: "/workspace/runs/20260422_101607__geometry-fixedcompute-1m-infonce-random-50ksteps"
    checkpoint_step: 50000

  - model_id: "lejepa_vitb16_delta"
    label: "LeJEPA ViT-B/16"
    source: "checkpoint"
    run_name: "delta-lejepa-vit-b16-multicrop-ddp4-b64"
    run_dir: "/workspace/models/delta_b16_final_checkpoints/20260512_210318__delta-lejepa-vit-b16-multicrop-ddp4-b64"
    checkpoint_step: 120000

  - model_id: "infonce_vitb16_delta"
    label: "InfoNCE ViT-B/16"
    source: "checkpoint"
    run_name: "delta-infonce-vit-b16-local2-ddp4-b64"
    run_dir: "/workspace/models/delta_b16_final_checkpoints/20260512_210345__delta-infonce-vit-b16-local2-ddp4-b64"
    checkpoint_step: 470000

  - model_id: "vicreg_vitb16_delta"
    label: "VICReg ViT-B/16"
    source: "checkpoint"
    run_name: "delta-vicreg-vit-b16-local2-ddp4-b64"
    run_dir: "/workspace/models/delta_b16_final_checkpoints/20260512_210452__delta-vicreg-vit-b16-local2-ddp4-b64"
    checkpoint_step: 415000

  - model_id: "dinov2_vitb14"
    label: "DINOv2 ViT-B/14"
    source: "external"
    run_name: "baseline-dinov2-vitb14"
    checkpoint_step: 0
    external_model: "dinov2_vitb14"

  - model_id: "mae_vitb16"
    label: "MAE ViT-B/16"
    source: "external"
    run_name: "baseline-mae-vitb16-in1k-pretrain"
    checkpoint_step: 0
    external_model: "mae_vitb16_in1k_pretrain"

extraction:
  batch_size: 128
  num_workers: 4
  device: "auto"
  precision: "fp32"
  overwrite: false

reduction:
  method: "tsne"
  random_state: 0
  tsne_perplexity: 30.0

supervised:
  label_column: "folder_label"
  group_column: "source_image_path"
  train_frac: 0.8
  seed: 0
  linear_epochs: 100
  linear_batch_size: 128
  linear_lr: 0.001
  finetune_epochs: 5
  finetune_batch_size: 32
  backbone_lr: 0.0001
  head_lr: 0.001
  weight_decay: 0.0001
