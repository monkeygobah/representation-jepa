study:
  name: "geometry_vit_b16_final_random"
  output_root: "/workspace/embedding_extract/outputs"

runs:
  - run_name: "geometry-vit-b16-final-lejepa-random"
    run_dir: "/workspace/models/delta_b16_final_checkpoints/20260512_210318__delta-lejepa-vit-b16-multicrop-ddp4-b64"
    checkpoint_step: 120000

  - run_name: "geometry-vit-b16-final-infonce-random"
    run_dir: "/workspace/models/delta_b16_final_checkpoints/20260512_210345__delta-infonce-vit-b16-local2-ddp4-b64"
    checkpoint_step: 470000

  - run_name: "geometry-vit-b16-final-vicreg-random"
    run_dir: "/workspace/models/delta_b16_final_checkpoints/20260512_210452__delta-vicreg-vit-b16-local2-ddp4-b64"
    checkpoint_step: 415000

datasets:
  - dataset_name: "subset6_minus_7_test"
    root: "/workspace/data/subset6_minus_7_test_flat"
    split_label: "test"
    image_size: 224
    normalize_imagenet: true

  - dataset_name: "subset7_eval"
    root: "/workspace/data/subset7_eval_224_flat"
    split_label: "eval"
    image_size: 224
    normalize_imagenet: true

  - dataset_name: "cfc_eval"
    root: "/workspace/data/cfc_split_eval_224"
    split_label: "eval"
    image_size: 224
    normalize_imagenet: true

extraction:
  batch_size: 256
  num_workers: 4
  device: "cuda:0"
  precision: "fp32"
  overwrite: false

artifact:
  save_backbone: false
  save_projected: true

analyses:
  isotropy:
    enabled: true
    num_pairs: 200000
    seed: 0
    embedding_keys: ["proj"]

aggregation:
  summary_csv: "isotropy_summary_vit_b16_final_random.csv"
  row_keys: ["run_name", "checkpoint_step", "dataset_name", "split_label", "embedding_key"]
