study:
  name: "geometry_10k_50ksteps"
  output_root: "/workspace/embedding_extract/outputs"

runs:
  - run_name: "geometry-fixedcompute-10k-infonce-imagenet-50ksteps"
    run_dir: "/workspace/runs/20260418_042402__geometry-fixedcompute-10k-infonce-imagenet-50ksteps"
    checkpoint_step: 50000

  - run_name: "geometry-fixedcompute-10k-infonce-random-50ksteps"
    run_dir: "/workspace/runs/20260421_105703__geometry-fixedcompute-10k-infonce-random-50ksteps"
    checkpoint_step: 50000

  - run_name: "geometry-fixedcompute-10k-infonce-seginit-50ksteps"
    run_dir: "/workspace/runs/20260422_104525__geometry-fixedcompute-10k-infonce-seginit-50ksteps"
    checkpoint_step: 50000

  - run_name: "geometry-fixedcompute-10k-lejepa-imagenet-50ksteps"
    run_dir: "/workspace/runs/20260418_085726__geometry-fixedcompute-10k-lejepa-imagenet-50ksteps"
    checkpoint_step: 50000

  - run_name: "geometry-fixedcompute-10k-lejepa-random-50ksteps"
    run_dir: "/workspace/runs/20260421_184610__geometry-fixedcompute-10k-lejepa-random-50ksteps"
    checkpoint_step: 50000

  - run_name: "geometry-fixedcompute-10k-lejepa-seginit-50ksteps"
    run_dir: "/workspace/runs/20260423_010943__geometry-fixedcompute-10k-lejepa-seginit-50ksteps"
    checkpoint_step: 50000

  - run_name: "geometry-fixedcompute-10k-vicreg-imagenet-50ksteps"
    run_dir: "/workspace/runs/20260418_131622__geometry-fixedcompute-10k-vicreg-imagenet-50ksteps"
    checkpoint_step: 50000

  - run_name: "geometry-fixedcompute-10k-vicreg-random-50ksteps"
    run_dir: "/workspace/runs/20260422_023125__geometry-fixedcompute-10k-vicreg-random-50ksteps"
    checkpoint_step: 50000

  - run_name: "geometry-fixedcompute-10k-vicreg-seginit-50ksteps"
    run_dir: "/workspace/runs/20260423_140953__geometry-fixedcompute-10k-vicreg-seginit-50ksteps"
    checkpoint_step: 50000

datasets:
  - dataset_name: "subset6_minus_7_test"
    root: "/workspace/data/subset6_minus_7_test_flat"
    split_label: "test"
    image_size: 224
    normalize_imagenet: true

  - dataset_name: "subset7_eval"
    root: "/workspace/data/subset7_eval_224_flat"
    split_label: "eval"
    image_size: 224
    normalize_imagenet: true

  - dataset_name: "cfc_eval"
    root: "/workspace/data/cfc_split_eval_224"
    split_label: "eval"
    image_size: 224
    normalize_imagenet: true

extraction:
  batch_size: 256
  num_workers: 4
  device: "cuda:0"
  precision: "fp32"
  overwrite: false

artifact:
  save_backbone: true
  save_projected: true

analyses:
  isotropy:
    enabled: true
    num_pairs: 200000
    seed: 0
    embedding_keys: ["emb"]

aggregation:
  summary_csv: "isotropy_summary_10k_50ksteps_emb.csv"
  row_keys: ["run_name", "checkpoint_step", "dataset_name", "split_label", "embedding_key"]
