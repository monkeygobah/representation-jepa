study:
  name: "geometry_100k_50ksteps"
  output_root: "/workspace/embedding_extract/outputs"

runs:
  - run_name: "geometry-fixedcompute-100k-infonce-imagenet-50ksteps"
    run_dir: "/workspace/runs/20260417_172251__geometry-fixedcompute-100k-infonce-imagenet-50ksteps"
    checkpoint_step: 50000

  - run_name: "geometry-fixedcompute-100k-infonce-random-50ksteps"
    run_dir: "/workspace/runs/20260420_145205__geometry-fixedcompute-100k-infonce-random-50ksteps"
    checkpoint_step: 50000

  - run_name: "geometry-fixedcompute-100k-infonce-seginit-50ksteps"
    run_dir: "/workspace/runs/20260420_145010__geometry-fixedcompute-100k-infonce-seginit-50ksteps"
    checkpoint_step: 50000

  - run_name: "geometry-fixedcompute-100k-lejepa-imagenet-50ksteps"
    run_dir: "/workspace/runs/20260417_205629__geometry-fixedcompute-100k-lejepa-imagenet-50ksteps"
    checkpoint_step: 50000

  - run_name: "geometry-fixedcompute-100k-lejepa-random-50ksteps"
    run_dir: "/workspace/runs/20260420_212507__geometry-fixedcompute-100k-lejepa-random-50ksteps"
    checkpoint_step: 50000

  - run_name: "geometry-fixedcompute-100k-lejepa-seginit-50ksteps"
    run_dir: "/workspace/runs/20260421_053048__geometry-fixedcompute-100k-lejepa-seginit-50ksteps"
    checkpoint_step: 50000

  - run_name: "geometry-fixedcompute-100k-vicreg-imagenet-50ksteps"
    run_dir: "/workspace/runs/20260418_003703__geometry-fixedcompute-100k-vicreg-imagenet-50ksteps"
    checkpoint_step: 50000

  - run_name: "geometry-fixedcompute-100k-vicreg-random-50ksteps"
    run_dir: "/workspace/runs/20260421_041119__geometry-fixedcompute-100k-vicreg-random-50ksteps"
    checkpoint_step: 50000

  - run_name: "geometry-fixedcompute-100k-vicreg-seginit-50ksteps"
    run_dir: "/workspace/runs/20260421_203755__geometry-fixedcompute-100k-vicreg-seginit-50ksteps"
    checkpoint_step: 50000

datasets:
  - dataset_name: "subset6_minus_7_test"
    root: "/workspace/data/subset6_minus_7_test_flat"
    split_label: "test"
    image_size: 224
    normalize_imagenet: true

  - dataset_name: "subset7_eval"
    root: "/workspace/data/subset7_eval_224_flat"
    split_label: "eval"
    image_size: 224
    normalize_imagenet: true

  - dataset_name: "cfc_eval"
    root: "/workspace/data/cfc_split_eval_224"
    split_label: "eval"
    image_size: 224
    normalize_imagenet: true

extraction:
  batch_size: 256
  num_workers: 4
  device: "cuda:0"
  precision: "fp32"
  overwrite: false

artifact:
  save_backbone: true
  save_projected: true

analyses:
  isotropy:
    enabled: true
    num_pairs: 200000
    seed: 0
    embedding_keys: ["emb"]

aggregation:
  summary_csv: "isotropy_summary_100k_50ksteps_emb.csv"
  row_keys: ["run_name", "checkpoint_step", "dataset_name", "split_label", "embedding_key"]
