study:
  name: "ep_bhep_1m_50k_landmark_probe"
  output_root: "/workspace/landmark_probe/outputs"

dataset_cfg: "/workspace/landmark_probe/configs/datasets/periorbital_224_v2.yaml"
probe_cfg: "/workspace/landmark_probe/configs/probes/mlp_default.yaml"

representations:
  - embedding_key: "backbone"
    pooling: "g4"

runs:
  - run_name: "geometry-fixedcompute-1m-eppartial-random-50ksteps"
    run_dir: "/workspace/runs/20260427_184206__geometry-fixedcompute-1m-eppartial-random-50ksteps"
    checkpoint_step: 50000
  - run_name: "geometry-fixedcompute-1m-eppartial-imagenet-50ksteps"
    run_dir: "/workspace/runs/20260427_184205__geometry-fixedcompute-1m-eppartial-imagenet-50ksteps"
    checkpoint_step: 50000
  - run_name: "geometry-fixedcompute-1m-bhep-random-50ksteps"
    run_dir: "/workspace/runs/20260428_121145__geometry-fixedcompute-1m-bhep-random-50ksteps"
    checkpoint_step: 50000
  - run_name: "geometry-fixedcompute-1m-bhep-imagenet-50ksteps"
    run_dir: "/workspace/runs/20260427_184206__geometry-fixedcompute-1m-bhep-imagenet-50ksteps"
    checkpoint_step: 50000

tasks:
  - task_name: "celeb_within"
    train_split:
      dataset_name: "celeb"
      split: "train"
    val_split:
      dataset_name: "celeb"
      split: "val"
    test_split:
      dataset_name: "celeb"
      split: "test"
  - task_name: "cfd_within"
    train_split:
      dataset_name: "cfd"
      split: "train"
    val_split:
      dataset_name: "cfd"
      split: "val"
    test_split:
      dataset_name: "cfd"
      split: "test"

extraction:
  batch_size: 256
  num_workers: 4
  device: "cuda:1"
  precision: "fp32"
  overwrite: false

artifact:
  save_embeddings: true
  save_predictions: true
  save_per_sample_metrics: true
