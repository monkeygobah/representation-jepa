tasks:
  - task_name: "celeb_within"
    train_split:
      dataset_name: "celeb"
      split: "train"
    val_split:
      dataset_name: "celeb"
      split: "val"
    test_split:
      dataset_name: "celeb"
      split: "test"
  - task_name: "cfd_within"
    train_split:
      dataset_name: "cfd"
      split: "train"
    val_split:
      dataset_name: "cfd"
      split: "val"
    test_split:
      dataset_name: "cfd"
      split: "test"
  - task_name: "celeb_to_cfd"
    train_split:
      dataset_name: "celeb"
      split: "train"
    val_split:
      dataset_name: "celeb"
      split: "val"
    test_split:
      dataset_name: "cfd"
      split: "test"

extraction:
  batch_size: 128
  num_workers: 4
  device: "cuda:2"
  precision: "fp32"
  overwrite: false

artifact:
  save_embeddings: true
  save_predictions: true
  save_per_sample_metrics: true
