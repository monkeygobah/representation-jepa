study:
  name: "external_vit_landmark_probe"
  output_root: "/workspace/landmark_probe/outputs"

dataset_cfg: "/workspace/landmark_probe/configs/datasets/periorbital_224_v2.yaml"
probe_cfg: "/workspace/landmark_probe/configs/probes/mlp_default.yaml"

representations:
  - embedding_key: "patch_tokens"
    pooling: "g4"

runs:
  - run_name: "baseline-dinov2-vitb14"
    checkpoint_step: 0
    external_model: "dinov2_vitb14"
  - run_name: "baseline-mae-vitb16-in1k-pretrain"
    checkpoint_step: 0
    external_model: "mae_vitb16_in1k_pretrain"

tasks:
  - task_name: "celeb_within"
    train_split:
      dataset_name: "celeb"
      split: "train"
    val_split:
      dataset_name: "celeb"
      split: "val"
    test_split:
      dataset_name: "celeb"
      split: "test"
  - task_name: "cfd_within"
    train_split:
      dataset_name: "cfd"
      split: "train"
    val_split:
      dataset_name: "cfd"
      split: "val"
    test_split:
      dataset_name: "cfd"
      split: "test"
  - task_name: "celeb_to_cfd"
    train_split:
      dataset_name: "celeb"
      split: "train"
    val_split:
      dataset_name: "celeb"
      split: "val"
    test_split:
      dataset_name: "cfd"
      split: "test"

extraction:
  batch_size: 128
  num_workers: 4
  device: "cuda:2"
  precision: "fp32"
  overwrite: false

artifact:
  save_embeddings: true
  save_predictions: true
  save_per_sample_metrics: true
