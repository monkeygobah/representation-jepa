study:
  name: "followup_50k_landmark_probe"
  output_root: "/workspace/landmark_probe/outputs"

dataset_cfg: "/workspace/landmark_probe/configs/datasets/periorbital_224_v2.yaml"
probe_cfg: "/workspace/landmark_probe/configs/probes/mlp_default.yaml"

representations:
  - embedding_key: "backbone"
    pooling: "g4"

runs:
  - run_name: "baseline-random"
    checkpoint_step: 0
    baseline_init: "random"
    baseline_seed: 2026
  - run_name: "baseline-imagenet"
    checkpoint_step: 0
    baseline_init: "imagenet"
  - run_name: "baseline-seginit"
    checkpoint_step: 0
    baseline_init: "seg_init"
    baseline_seg_ckpt: "/workspace/models/hp_tune.pth"

tasks:
  - task_name: "celeb_within"
    train_split:
      dataset_name: "celeb"
      split: "train"
    val_split:
      dataset_name: "celeb"
      split: "val"
    test_split:
      dataset_name: "celeb"
      split: "test"
  - task_name: "cfd_within"
    train_split:
      dataset_name: "cfd"
      split: "train"
    val_split:
      dataset_name: "cfd"
      split: "val"
    test_split:
      dataset_name: "cfd"
      split: "test"

extraction:
  batch_size: 256
  num_workers: 4
  device: "cuda:2"
  precision: "fp32"
  overwrite: false

artifact:
  save_embeddings: true
  save_predictions: true
  save_per_sample_metrics: true
